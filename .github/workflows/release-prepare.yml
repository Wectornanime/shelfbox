name: Dev Version and Changelog

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  prepare-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate next version
        id: version
        run: |
          VERSION=$(npm run release:next --silent)

          if [ -z "$VERSION" ] || [ "$VERSION" = "No release needed" ]; then
            echo "No release needed."
            exit 0
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Version $VERSION is already set in package.json. Skipping."
            exit 0
          fi

          echo "Next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update project version
        if: steps.version.outputs.version != ''
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Generate changelog
        if: steps.version.outputs.version != ''
        run: |
          npx conventional-changelog \
            -p angular \
            -i CHANGELOG.md \
            -s \
            -r 0

      - name: Commit and push changes
        if: steps.version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json CHANGELOG.md

          git diff --cached --quiet || \
            git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"

          git push origin dev
